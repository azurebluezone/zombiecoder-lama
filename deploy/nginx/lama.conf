# lama reverse proxy — the only door that faces the network.
#
# Rendered by scripts/install-nginx-proxy.sh into /etc/nginx/conf.d/lama.conf.
# The manager itself stays on 127.0.0.1:9934; this file is what a remote client
# talks to. Nothing here imports the admin app or exposes the engine port.
#
# __LAMA_KEY__ is replaced with the generated bearer token.

# 48-char tokens exceed the default 32-byte map key bucket.
map_hash_bucket_size 128;

map $http_authorization $lama_authorized {
    default 0;
    "Bearer __LAMA_KEY__" 1;
}

server {
    listen __LAMA_LISTEN__;
    server_name _;

    # Request bodies are JSON chat payloads; 8 MiB is generous and bounded.
    client_max_body_size 8m;

    # No admin UI, no engine port, no directory listing: only /v1 and /healthz.
    location /v1/ {
        if ($lama_authorized = 0) {
            return 401;
        }

        proxy_pass http://127.0.0.1:__LAMA_MGMT_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # Streaming (SSE) must not be buffered, and a 1B model on CPU is slow.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:__LAMA_MGMT_PORT__/healthz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}
